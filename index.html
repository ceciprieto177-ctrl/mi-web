<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro e Inicio de Sesión</title>
    <style>
        /* Estilos Generales - El "Maquillaje" */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box; /* Importante para el ancho */
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            padding: 10px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Crear Cuenta</h2>
        
        <form id="registro-form">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ej: Cecilia Prieto" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="nombre@correo.com" required>
            </div>

            <div class="form-group">
                <label>Sexo:</label>
                <div class="radio-group">
                    <label style="font-weight: normal;"><input type="radio" name="sexo" value="Mujer" required> Mujer</label>
                    <label style="font-weight: normal;"><input type="radio" name="sexo" value="Hombre"> Hombre</label>
                    <label style="font-weight: normal;"><input type="radio" name="sexo" value="Otro"> Otro</label>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Tu contraseña secreta" required>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>

    <script>
        // El cerebro que valida todo
        document.getElementById('registro-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita que la página se refresque

            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const sexo = document.querySelector('input[name="sexo"]:checked').value;

            // Alerta personalizada y linda
            alert('¡Hola ' + nombre + '!\nTu registro como ' + sexo + ' ha sido exitoso.\nTe enviamos un correo a: ' + email);
        });
    </script>


</body>
</html>
