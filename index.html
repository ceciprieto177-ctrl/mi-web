<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi CV Digital - Ceci</title>
</head>
<body>

    <h1>Hola Paraguay</h1>
    <p>¡Mi primer sitio web con Git!</p>
    
    <hr> <h1>Cecilia Prieto</h1>
    <p>Estudiante de Informática y Administración</p>
    
    <h2>Educación</h2>
    <hr>

    <h2>Iniciar Sesión</h2>
    <form id="login-form">
        </form>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) {
                alert('Por favor, complete todos los campos.');
            } else {
                alert('¡Formulario enviado con éxito!');
            }
        });
    </script>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f4f4f9;
    }
    h1 {
        color: #2c3e50;
        border-bottom: 2px solid #3498db;
        padding-bottom: 10px;
    }
    h2 {
        color: #2980b9;
        margin-top: 30px;
    }
    ul {
        background: white;
        padding: 20px 40px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    form {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #ddd;
    }
    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box; /* Para que no se salga del borde */
    }
    button {
        background-color: #3498db;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-size: 16px;
    }
    button:hover {
        background-color: #2980b9;
    }
</style>
</body>
</html>
